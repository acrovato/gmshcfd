[project]
name = 'gmshcfd'
description = 'GmshCFD - a tool based on Gmsh for creating CFD meshes around lifting surfaces suitable for external aerodynamic analysis.'
version = '1.2.0'
authors = [
    { name = 'Adrien Crovato'}
]
keywords = ['Gmsh', 'CFD', 'aerodynamic', 'mesh', 'Python']
readme = 'README.md'
license = 'GPL-3.0-only'
license-files = ['LICENSE']
requires-python = '>= 3.10'
dependencies = [
    'numpy>=1.22',
    'scipy>=1.10',
    'gmsh>=4.10.5'
]

[project.scripts]
gmshcfd-run = 'gmshcfd.cli:main'

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
'gmshcfd' = 'gmshcfd'

name: Continuous integration

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: onelab/ubuntu20.04
      options: --user root
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6.2.0
    - name: Install
      run: |
        python3 -m pip install .
    - name: Test
      run: |
        for f in examples/*.py; do gmshcfd-run "$f"; done

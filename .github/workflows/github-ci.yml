name: Continuous integration

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: onelab/ubuntu24.04
      options: --user root
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Install system dependencies
      run: |
        apt update
        apt install -y python3-venv
    - name: Install
      run: |
        python3 -m venv .venv
        .venv/bin/python3 -m pip install .
    - name: Test
      run: |
        . .venv/bin/activate
        for f in examples/*.py; do gmshcfd-run "$f"; done
